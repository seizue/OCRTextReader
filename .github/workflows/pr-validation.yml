name: PR Validation

on:
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  validate:
    name: Validate Pull Request
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      id: build
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Debug /p:Platform="Any CPU" /m

    - name: Comment PR result
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const success = '${{ steps.build.outcome }}' === 'success';
          const icon = success ? '✅' : '❌';
          const msg = success ? 'Build passed.' : 'Build failed — check the logs.';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${icon} ${msg}`
          });
