name: PR Validation

on:
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  validate:
    name: Validate Pull Request
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Debug --no-restore
      
    - name: Check for build warnings
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Debug --no-restore --verbosity normal
      
    - name: Comment PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Build validation completed successfully!'
          })
