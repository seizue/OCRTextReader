name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, master, develop ]

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Debug /p:Platform="Any CPU" /m

    - name: Build (Release)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCRTextReader-build-${{ github.sha }}
        path: bin/Release/net48/
        retention-days: 7

  release:
    name: Publish Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build Release
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="bin\Release\net48" /m

    - name: Find build output
      run: |
        Write-Host "=== Searching for OCRTextReader.exe ==="
        Get-ChildItem -Path . -Filter "OCRTextReader.exe" -Recurse -ErrorAction SilentlyContinue |
          Select-Object FullName
        Write-Host "=== bin folder contents ==="
        Get-ChildItem -Path "bin" -Recurse -ErrorAction SilentlyContinue |
          Select-Object FullName

    - name: Stage release assets
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $outDir = "release-assets"
        $buildOut = "bin\Release\net48"

        Write-Host "Build output contents:"
        Get-ChildItem $buildOut -ErrorAction SilentlyContinue | Select-Object Name

        New-Item -ItemType Directory -Path $outDir | Out-Null
        Copy-Item "$buildOut\OCRTextReader.exe" "$outDir\OCRTextReader-$version.exe"
        Compress-Archive -Path "$buildOut\*" -DestinationPath "$outDir\OCRTextReader-$version.zip"
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "OUT_DIR=$outDir" >> $env:GITHUB_ENV

    - name: Create GitHub Release and upload assets
      run: |
        gh release create "${{ github.ref_name }}" `
          "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}.exe" `
          "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}.zip" `
          --title "${{ github.ref_name }}" `
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
