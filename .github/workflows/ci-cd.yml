name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ created ]

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Debug /p:Platform="Any CPU" /m

    - name: Build (Release)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCRTextReader-build-${{ github.sha }}
        path: bin/Release/net48/
        retention-days: 7

  release:
    name: Publish Release
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build Release
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Create ZIP archive
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $zipName = "OCRTextReader-$tag.zip"
        Compress-Archive -Path bin/Release/net48/* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Upload ZIP to release
      run: |
        gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_NAME }}" --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
