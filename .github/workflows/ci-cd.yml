name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - '*.*.*'
  pull_request:
    branches: [ main, master, develop ]

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Debug /p:Platform="Any CPU" /m

    - name: Build (Release)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCRTextReader-build-${{ github.sha }}
        path: bin/Release/net48/
        retention-days: 7

  release:
    name: Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build Release
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="bin\Release\net48" /m

    - name: Build Inno Setup installer
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        Write-Host "ISCC exists: $(Test-Path $iscc)"
        & $iscc /DMyAppVersion="$version" "Setup\setup.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
        Write-Host "=== installer-output contents ==="
        Get-ChildItem "installer-output" -ErrorAction SilentlyContinue | Select-Object Name
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Stage release assets
      run: |
        $version = "${{ env.VERSION }}"
        $outDir = "release-assets"
        New-Item -ItemType Directory -Path $outDir | Out-Null

        $installer = "installer-output\OCRTextReader-$version-setup.exe"
        Write-Host "Looking for: $installer"
        if (-not (Test-Path $installer)) { throw "Installer not found at $installer" }

        Copy-Item $installer "$outDir\OCRTextReader-$version-setup.exe"
        Compress-Archive -Path "bin\Release\net48\*" -DestinationPath "$outDir\OCRTextReader-$version.zip"
        echo "OUT_DIR=$outDir" >> $env:GITHUB_ENV

    - name: Sign installer
      if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
      env:
        SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      run: |
        $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
        [IO.File]::WriteAllBytes("signing.pfx", $certBytes)

        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
          -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match "x64" } |
          Select-Object -First 1 -ExpandProperty FullName

        & $signtool sign `
          /f "signing.pfx" `
          /p $env:SIGNING_CERT_PASSWORD `
          /fd SHA256 `
          /tr http://timestamp.digicert.com `
          /td SHA256 `
          "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}-setup.exe"

        Remove-Item "signing.pfx" -Force

    - name: Create GitHub Release and upload assets
      run: |
        gh release create "${{ github.ref_name }}" `
          "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}-setup.exe" `
          "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}.zip" `
          --title "${{ github.ref_name }}" `
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
