name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ created ]

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Debug /p:Platform="Any CPU" /m

    - name: Build (Release)
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCRTextReader-build-${{ github.sha }}
        path: bin/Release/net48/
        retention-days: 7

  release:
    name: Publish Release
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build Release
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Generate release notes
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $notes = gh api repos/${{ github.repository }}/releases/generate-notes `
          -f tag_name="$tag" `
          --jq '.body'
        gh release edit "$tag" --notes "$notes"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Stage release assets
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $version = $tag -replace '^v', ''
        $outDir = "release-assets"
        New-Item -ItemType Directory -Path $outDir | Out-Null

        # Copy the main exe with a versioned name
        Copy-Item "bin\Release\net48\OCRTextReader.exe" "$outDir\OCRTextReader-$version.exe"

        # Create a ZIP of the full output (exe + all dependencies)
        Compress-Archive -Path "bin\Release\net48\*" -DestinationPath "$outDir\OCRTextReader-$version.zip"

        echo "TAG=$tag" >> $env:GITHUB_ENV
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "OUT_DIR=$outDir" >> $env:GITHUB_ENV

    - name: Upload EXE to release
      run: |
        gh release upload "${{ env.TAG }}" "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}.exe" --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP to release
      run: |
        gh release upload "${{ env.TAG }}" "${{ env.OUT_DIR }}\OCRTextReader-${{ env.VERSION }}.zip" --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
