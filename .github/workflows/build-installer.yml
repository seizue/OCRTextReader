name: Build Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

env:
  PROJECT_PATH: 'OCRTextReader.csproj'

jobs:
  build-installer:
    name: Build & Package
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.PROJECT_PATH }}

    - name: Build Release
      run: msbuild ${{ env.PROJECT_PATH }} /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Create ZIP archive
      run: |
        $version = "${{ github.event.inputs.version }}"
        $zipName = "OCRTextReader-$version.zip"
        Compress-Archive -Path bin/Release/net48/* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCRTextReader-${{ github.event.inputs.version }}
        path: ${{ env.ZIP_NAME }}
        retention-days: 30
